<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فروشگاه وید</title>
<style>
:root{--bg:#eef3e4;--card:#fffdf5;--tx:#1d2a17;--mut:#6c7a5f;--ac:#3d8b2f;--hot:#e8871e;--bd:#cfdab8;--bad:#c8433a;--bar:#dfe8cc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a10;--card:#1b2618;--tx:#e9f0dc;--mut:#93a285;--ac:#7bd35a;--hot:#ffa63d;--bd:#2c3b27;--bad:#ff7168;--bar:#26331f}}
:root[data-theme="dark"]{--bg:#121a10;--card:#1b2618;--tx:#e9f0dc;--mut:#93a285;--ac:#7bd35a;--hot:#ffa63d;--bd:#2c3b27;--bad:#ff7168;--bar:#26331f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif}
body{padding-bottom:84px;min-height:100vh}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;padding:10px;background:var(--bg);border-bottom:2px solid var(--bd)}
.top div{flex:1;background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:6px 4px;text-align:center;font-weight:700;font-size:14px}
.top small{display:block;font-weight:400;color:var(--mut);font-size:11px}
main{padding:12px;max-width:560px;margin:auto}
h2{font-size:17px;margin:4px 0 10px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.pot{min-height:96px}
.em{font-size:34px}
.bar{height:12px;background:var(--bar);border-radius:8px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ac);width:0}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 14px;background:var(--ac);color:#fff;cursor:pointer;min-height:44px}
.dk button{color:#10200b}
@media(prefers-color-scheme:dark){button{color:#10200b}}
button.o{background:var(--hot);color:#2a1700}
button.g{background:transparent;color:var(--tx);border:2px solid var(--bd)}
button:disabled{opacity:.4}
button:active{transform:scale(.97)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.chip{white-space:nowrap;padding:8px 12px;border-radius:20px;border:2px solid var(--bd);background:var(--card);font-weight:700;font-size:13px;cursor:pointer}
.chip.on{border-color:var(--ac);background:var(--ac);color:#fff}
@media(prefers-color-scheme:dark){.chip.on{color:#10200b}}
.mut{color:var(--mut);font-size:13px}
.big{font-size:44px;font-weight:800;line-height:1.1}
.up{color:var(--ac)}.dn{color:var(--bad)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:2px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav b{flex:1;text-align:center;padding:10px 0 8px;font-size:12px;color:var(--mut);cursor:pointer}
nav b span{display:block;font-size:22px}
nav b.on{color:var(--hot)}
#toast{position:fixed;top:78px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .25s;z-index:9;pointer-events:none}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:20;display:none;align-items:center;justify-content:center}
#stage{position:relative;width:min(92vw,380px);height:min(78vh,520px);background:var(--card);border:2px solid var(--bd);border-radius:20px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.x{position:absolute;top:8px;left:8px;z-index:5;min-height:36px;padding:4px 12px}
.msg{position:absolute;top:14px;right:14px;left:64px;font-weight:700;font-size:14px}
.bud{position:absolute;font-size:42px;transform:translate(-50%,-50%);transition:top .5s,opacity .5s;z-index:2}
.bud.fall{top:105%!important;opacity:0}
.pk{transition:none;cursor:grab;touch-action:none}
.stalk{position:absolute;left:50%;bottom:100px;width:8px;height:55%;background:var(--ac);transform:translateX(-50%);border-radius:4px}
.potem{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:100px;line-height:1}
#sc{position:absolute;font-size:46px;pointer-events:none;transform:translate(-50%,-50%) rotate(-30deg);z-index:4}
#bag{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);width:210px;height:170px;border:3px solid var(--ac);border-top-style:dashed;border-radius:6px 6px 26px 26px;background:rgba(120,200,90,.15);display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;padding-bottom:10px;font-weight:800}
#bag span{width:100%;text-align:center}
#bag i{font-style:normal;font-size:30px}
#lid{position:absolute;bottom:270px;left:50%;transform:translateX(-50%);width:230px;height:42px;background:var(--hot);color:#2a1700;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;transition:bottom .5s;cursor:pointer;z-index:3}
#lid.shut{bottom:196px}
body{background:radial-gradient(circle at 15% 0,rgba(61,139,47,.2),transparent 55%),radial-gradient(circle at 100% 100%,rgba(232,135,30,.12),transparent 50%),var(--bg);background-attachment:fixed}
h2{border-right:5px solid var(--hot);padding-right:8px;border-radius:2px}
.card{border-radius:18px;box-shadow:0 3px 0 var(--bd)}
.top div{border-radius:14px;box-shadow:0 2px 0 var(--bd)}
button{background:linear-gradient(180deg,var(--ac),color-mix(in srgb,var(--ac) 72%,#000));box-shadow:0 3px 0 rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s}
button.o{background:linear-gradient(180deg,var(--hot),color-mix(in srgb,var(--hot) 75%,#000))}
button.g{box-shadow:none}
button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.bar{height:14px;border-radius:10px;box-shadow:inset 0 2px 3px rgba(0,0,0,.18)}
.bar i{background:repeating-linear-gradient(135deg,var(--ac) 0 10px,color-mix(in srgb,var(--ac) 78%,#fff) 10px 20px);background-size:28px 28px;border-radius:10px;transition:width .25s linear;animation:mv 1s linear infinite}
@keyframes mv{to{background-position:28px 0}}
.pot .em{background:var(--bar);width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.ready{border-color:var(--hot);animation:gl 1.6s ease-in-out infinite}
@keyframes gl{50%{box-shadow:0 3px 0 var(--bd),0 0 0 5px rgba(232,135,30,.28)}}
nav{border-radius:22px 22px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.14)}
nav b.on{font-weight:800}
nav b.on span{transform:translateY(-3px) scale(1.18);transition:transform .15s}
.chip{box-shadow:0 2px 0 var(--bd)}
#stage{background:radial-gradient(circle at 50% 100%,rgba(120,200,90,.28),transparent 70%),var(--card)}
.bud{filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
#sc{filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
#bag{background:linear-gradient(180deg,rgba(120,200,90,.08),rgba(120,200,90,.3))}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.bd{transition:transform .5s,opacity .5s}
.bd.fall{transform:translateY(90px);opacity:0}
#sc{line-height:0}
.pk svg,.bud svg{pointer-events:none;display:block}
.pot .em svg{display:block}
.sci{display:flex;flex:none;background:var(--bar);border-radius:16px;padding:6px}
.coll{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px}
.ci{position:relative;flex:none;width:72px;text-align:center;padding:8px 4px;border-radius:14px;border:2px solid var(--bd);background:var(--bar)}
.ci small{display:block;font-size:11px;font-weight:700;margin-top:2px;padding-bottom:2px}
.ci.lk svg{filter:grayscale(1) brightness(.6)!important;opacity:.55}
.ci em{position:absolute;top:2px;left:4px;font-style:normal;font-size:12px}
body{background:radial-gradient(circle at 15% 0,color-mix(in srgb,var(--ac) 22%,transparent),transparent 55%),radial-gradient(circle at 100% 100%,color-mix(in srgb,var(--hot) 14%,transparent),transparent 50%),var(--bg);background-attachment:fixed}
:root[data-theme=dark] button,:root[data-theme=dark] .chip.on{color:#10200b}
:root[data-theme=light] button,:root[data-theme=light] .chip.on{color:#fff}
:root[data-theme] button.g{color:var(--tx)}
:root[data-theme=light] button.o{color:#2a1700}
nav b{position:relative}
.bdg{position:absolute;top:2px;right:calc(50% - 24px);background:var(--bad);color:#fff;border-radius:10px;font-size:10px;font-style:normal;padding:0 6px;font-weight:800}
.av{font-size:32px;line-height:1}
.bub{background:var(--bar);border-radius:14px 14px 14px 4px;padding:10px 12px;margin:8px 0;font-size:14px}
.sm{padding:8px 12px;min-height:40px}
.bar i{animation:none;background:var(--ac)}
.ready{animation:none}
.bud,#sc{filter:none}
body{background-attachment:scroll}
.zb{position:relative;border-radius:8px 8px 22px 22px;border:2px solid rgba(150,180,200,.8);background:linear-gradient(135deg,rgba(255,255,255,.4),rgba(255,255,255,.06) 55%,rgba(255,255,255,.22)),color-mix(in srgb,var(--sc,#6bc84a) 20%,transparent);box-shadow:inset 0 0 14px rgba(255,255,255,.3),0 3px 0 var(--bd)}
.zb:before{content:'';position:absolute;top:5px;left:50%;width:14px;height:9px;margin-left:-7px;border:2px solid rgba(150,180,200,.9);border-radius:50%}
.zb .zr{position:absolute;left:-2px;right:-2px;top:24px;height:11px;background:repeating-linear-gradient(90deg,#9db4c2 0 5px,#d6e3ea 5px 10px);border-top:2px solid #7f98a8;border-bottom:2px solid #7f98a8}
.zb .zr.shut{background:repeating-linear-gradient(90deg,#2f8fd0 0 5px,#8fd4f7 5px 10px);border-color:#1f6fa8}
.zb .in{position:absolute;top:42px;left:6px;right:6px;bottom:28px;display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;font-size:22px;line-height:1}
.zb .in i{font-style:normal}
.zb .lab{position:absolute;bottom:6px;left:10px;right:10px;background:#fff;color:#222;border-radius:5px;text-align:center;font-size:11px;font-weight:800;padding:2px 0}
.zb.big{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);width:230px;height:210px}
.zb.big .in{font-size:34px;top:50px}
#zh{display:none;position:absolute;top:-6px;left:2px;width:30px;height:22px;border-radius:7px;background:linear-gradient(#ffd24a,#e0a800);color:#5a3b00;align-items:center;justify-content:center;font-weight:800;cursor:grab;touch-action:none;box-shadow:0 2px 0 rgba(0,0,0,.3);z-index:2}
.sh{display:flex;gap:12px;overflow-x:auto;padding:10px 2px}
.sh .zb{width:100px;height:140px;cursor:pointer;margin-bottom:6px}
.zb.e{opacity:.45;filter:grayscale(.6)}
</style>
</head>
<body>
<div class="top" id="top"></div>
<main id="main"></main>
<div id="toast"></div>
<div id="ov"><div id="stage"></div></div>
<nav id="nav"></nav>
<script>
const ST=[{n:'کلاسیک',e:'🌿',c:0,t:60,y:8,p:1},{n:'کوش',e:'🍃',c:120,t:120,y:20,p:5},{n:'هیز',e:'🌱',c:500,t:180,y:40,p:20},{n:'پرپل',e:'💜',c:2000,t:300,y:90,p:80}];
const POTC=[0,0,80,200,500,1200],MAXL=10,BAG=10;
const N=x=>(Math.round(x*10)/10).toLocaleString('fa-IR');
let G,tab='pots';
try{G=JSON.parse(localStorage.getItem('wg1'))}catch(e){}
if(!G||!G.pots)G={m:30,raw:0,bags:0,sc:0,pl:0,seeds:[1,0,0,0],pots:[null,null,null,null,null,null],np:2,price:40,hist:[40],next:Date.now()+60000,sel:0};
const save=()=>{try{localStorage.setItem('wg1',JSON.stringify(G))}catch(e){}};
const Y=s=>ST[s].y*1.15**G.sc;
const D=s=>ST[s].t*0.85**G.pl*1000;
const scC=()=>Math.round(40*1.9**G.sc), plC=()=>Math.round(60*2**G.pl);
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,1400)}
function stepPrice(){let p=G.price;p+=(45-p)*0.15;p*=0.75+Math.random()*0.5;G.price=Math.max(15,Math.min(120,Math.round(p)));G.hist.push(G.price);if(G.hist.length>20)G.hist.shift();G.next+=60000}
let n0=0;while(Date.now()>=G.next&&n0++<30)stepPrice();
if(Date.now()>=G.next)G.next=Date.now()+60000;

function plant(i){const s=G.sel,c=ST[s].p;if(G.m<c)return toast('پول کافی نداری');G.m-=c;G.pots[i]={t:Date.now(),s:s,d:D(s)};save();render()}
function cut(i){const p=G.pots[i];G.raw+=Y(p.s);G.pots[i]=null;toast('✂️ +'+N(Y(p.s))+' گرم');save();render()}
function pack(all){let k=all?Math.floor(G.raw/BAG):(G.raw>=BAG?1:0);if(!k)return toast('حداقل ۱۰ گرم لازمه');G.raw-=k*BAG;G.bags+=k;toast('📦 '+k+' کیسه پک شد');save();render()}
function sell(all){const k=all?G.bags:Math.min(1,G.bags);if(!k)return toast('کیسه‌ای نداری');G.bags-=k;G.m+=k*G.price;toast('💰 +'+(k*G.price).toLocaleString('fa-IR')+'$');save();render()}
function buyPot(){const c=POTC[G.np];if(G.m<c)return toast('پول کافی نداری');G.m-=c;G.np++;save();render()}
function upS(){const c=scC();if(G.m<c||G.sc>=MAXL)return toast('نمیشه');G.m-=c;G.sc++;save();render()}
function upP(){const c=plC();if(G.m<c||G.pl>=MAXL)return toast('نمیشه');G.m-=c;G.pl++;save();render()}
function unlock(k){const c=ST[k].c;if(G.m<c)return toast('پول کافی نداری');G.m-=c;G.seeds[k]=1;G.sel=k;save();render()}
function pick(k){G.sel=k;save();render()}
function go(t){tab=t;render()}
function openOv(h){document.getElementById('ov').style.display='flex';const s=document.getElementById('stage');s.innerHTML='<button class="g x" onclick="closeOv()">✕</button>'+h;s.onpointermove=s.onpointerdown=null;return s}
function closeOv(){document.getElementById('ov').style.display='none'}
function startCut(i){
 const p=G.pots[i],B=[[30,28],[70,26],[22,50],[78,48],[42,38],[60,36]];let left=B.length;
 const s=openOv('<div class="msg" id="msg"></div><div class="stalk"></div><div class="potem">🪴</div>'+B.map(b=>`<div class="bud" style="left:${b[0]}%;top:${b[1]}%">🌿</div>`).join('')+'<div id="sc" style="left:85%;top:80%">✂️</div>');
 const msg=()=>document.getElementById('msg').textContent='✂️ قیچی رو روی گل‌ها بکش · باقی‌مانده: '+left.toLocaleString('fa-IR');msg();
 const mv=e=>{const r=s.getBoundingClientRect(),sc=document.getElementById('sc');sc.style.left=(e.clientX-r.left)+'px';sc.style.top=(e.clientY-r.top)+'px';
  s.querySelectorAll('.bud:not(.fall)').forEach(b=>{const q=b.getBoundingClientRect();
   if(Math.hypot(e.clientX-(q.left+q.width/2),e.clientY-(q.top+q.height/2))<36){b.classList.add('fall');left--;msg();
    if(left==0)setTimeout(()=>{G.raw+=Y(p.s);G.pots[i]=null;save();closeOv();toast('✂️ +'+N(Y(p.s))+' گرم وید');render()},600)}})};
 s.onpointermove=s.onpointerdown=mv;
}
function startPack(){
 if(G.raw<BAG)return toast('حداقل ۱۰ گرم لازمه');
 const n=5;let pk=0;
 const s=openOv('<div class="msg" id="msg">گل‌ها رو بکش تو کیسه 👇</div>'+Array.from({length:n},(_,k)=>`<div class="bud pk" style="left:${18+k*16}%;top:${20+(k%2)*13}%">🌿</div>`).join('')+'<div id="bag"><span id="bc">۰/۵</span></div><div id="lid" style="display:none">🔒 درشو ببند</div>');
 const drop=b=>{b.remove();pk++;document.getElementById('bag').insertAdjacentHTML('afterbegin','<i>🌿</i>');
  document.getElementById('bc').textContent=pk.toLocaleString('fa-IR')+'/'+n.toLocaleString('fa-IR');
  if(pk==n){document.getElementById('msg').textContent='حالا درشو ببند 👆';const l=document.getElementById('lid');l.style.display='flex';
   l.onclick=()=>{l.classList.add('shut');l.textContent='✅ بسته شد';setTimeout(()=>{G.raw-=BAG;G.bags++;save();closeOv();toast('📦 یه کیسه پک شد');render()},700)}}};
 s.querySelectorAll('.pk').forEach(b=>{let dr=0,mv=0;
  b.onpointerdown=e=>{dr=1;mv=0;b.setPointerCapture(e.pointerId);b.style.zIndex=3};
  b.onpointermove=e=>{if(!dr)return;mv++;const r=s.getBoundingClientRect();b.style.left=(e.clientX-r.left)+'px';b.style.top=(e.clientY-r.top)+'px'};
  b.onpointerup=e=>{if(!dr)return;dr=0;const q=document.getElementById('bag').getBoundingClientRect();
   if(mv<3||(e.clientX>q.left&&e.clientX<q.right&&e.clientY>q.top&&e.clientY<q.bottom))drop(b)}});
}

function render(){
 document.getElementById('top').innerHTML=`<div>💰 ${G.m.toLocaleString('fa-IR')}$<small>پول</small></div><div>🌿 ${N(G.raw)}<small>گرم وید</small></div><div>📦 ${G.bags.toLocaleString('fa-IR')}<small>کیسه</small></div>`;
 document.getElementById('nav').innerHTML=[['pots','🪴','گلدون‌ها'],['shop','🛒','فروشگاه'],['pack','📦','پک'],['mkt','📈','بازار']].map(t=>`<b class="${tab==t[0]?'on':''}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</b>`).join('');
 let h='';
 if(tab=='pots'){
  h+='<h2>دانه‌ی انتخابی</h2><div class="chips">'+ST.map((s,k)=>G.seeds[k]?`<div class="chip ${G.sel==k?'on':''}" onclick="pick(${k})">${s.e} ${s.n}</div>`:'').join('')+'</div>';
  for(let i=0;i<G.np;i++){const p=G.pots[i];
   if(!p)h+=`<div class="card pot row"><div class="row"><span class="em">${plantSVG(G.sel,'empty')}</span><span style="display:none">🪴</span><div><b>گلدون ${(i+1).toLocaleString('fa-IR')}</b><div class="mut">خالیه</div></div></div><button onclick="plant(${i})">بکار ${ST[G.sel].e} (${ST[G.sel].p}$)</button></div>`;
   else if(Date.now()-p.t>=p.d)h+=`<div class="card pot row ready"><div class="row"><span class="em">${plantSVG(p.s,'ready')}</span><div><b>${ST[p.s].n} آماده‌ست</b><div class="mut">${N(Y(p.s))} گرم</div></div></div><button class="o" onclick="startCut(${i})">✂️ قیچی کن</button></div>`;
   else h+=`<div class="card pot"><div class="row"><div class="row"><span class="em">${plantSVG(p.s,'young')}</span><span style="display:none">🌱</span><b>${ST[p.s].n}</b></div><span class="mut" id="t${i}"></span></div><div class="bar"><i id="b${i}"></i></div></div>`;
  }
  if(G.np<6)h+=`<div class="card row"><div><b>گلدون جدید</b><div class="mut">گلدون ${(G.np+1).toLocaleString('fa-IR')}</div></div><button class="o" onclick="buyPot()">${POTC[G.np].toLocaleString('fa-IR')}$</button></div>`;
 }
 if(tab=='shop'){
  h+=`<h2>ارتقا</h2><div class="card row"><div><b>✂️ قیچی (سطح ${G.sc.toLocaleString('fa-IR')})</b><div class="mut">هر سطح ۱۵٪ وید بیشتر از هر بوته</div></div><button class="o" onclick="upS()" ${G.sc>=MAXL?'disabled':''}>${G.sc>=MAXL?'حداکثر':scC().toLocaleString('fa-IR')+'$'}</button></div>`;
  h+=`<div class="card row"><div><b>🪴 گلدون‌ها (سطح ${G.pl.toLocaleString('fa-IR')})</b><div class="mut">هر سطح ۱۵٪ زمان رشد کمتر</div></div><button class="o" onclick="upP()" ${G.pl>=MAXL?'disabled':''}>${G.pl>=MAXL?'حداکثر':plC().toLocaleString('fa-IR')+'$'}</button></div>`;
  h+='<h2>انواع دانه</h2>'+ST.map((s,k)=>`<div class="card row"><div><b>${s.e} ${s.n}</b><div class="mut">${N(Y(k))} گرم · ${N(D(k)/60000)} دقیقه · کاشت ${s.p}$</div></div>${G.seeds[k]?'<span class="mut">داری ✓</span>':`<button onclick="unlock(${k})">${s.c.toLocaleString('fa-IR')}$</button>`}</div>`).join('');
 }
 if(tab=='pack'){

 main.onclick=e=>{const a=e.target.closest('[data-p]');if(a){const [t,k]=a.dataset.p.split(':');return sellBag(+k,t=='all')}const q=e.target.closest('[data-pk]');if(q)return startPack(+q.dataset.pk);if(e.target.closest('[data-q]'))quickPack()};
}
const CN=['رضا','علی','سارا','مهدی','نگار','کیان','پویا','لیلا','امیر','مینا'],CA=['🧑','👩','🧔','👱','👨‍🦱','👩‍🦰'];
const MOOD=[{f:[.65,.9],t:'بودجه‌م کمه، یه قیمت خوب بده 🙏'},{f:[.95,1.2],t:'فقط قیمت منصفانه باشه 🙂'},{f:[1.25,1.7],t:'کیفیت مهمه، پول مشکلی نیست 😎'}];
G.cu=G.cu||[];G.nc=G.nc||Date.now()+8000;
function spawnC(){
 const m=Math.floor(Math.random()*3),M=MOOD[m],mx=Math.round(G.price*(M.f[0]+Math.random()*(M.f[1]-M.f[0])));
 G.cu.push({id:Date.now(),n:CN[Math.floor(Math.random()*CN.length)],av:CA[Math.floor(Math.random()*CA.length)],want:1+Math.floor(Math.random()*(2+G.np*1.5)),mood:m,max:Math.max(5,mx),o:G.price,exp:Date.now()+240000});
 save();toast('💬 پیام جدید');render()}
setInterval(()=>{const n=Date.now(),b=G.cu.length;G.cu=G.cu.filter(c=>c.exp>n);
 if(G.cu.length<b){save();render()}
 if(n>=G.nc&&G.cu.length<4){G.nc=n+30000+Math.random()*40000;spawnC()}else if(n>=G.nc)G.nc=n+10000},1000);
function msgUI(){
 const nav=document.getElementById('nav'),b=document.createElement('b'),n=G.cu.length;
 b.className=tab=='msg'?'on':'';b.innerHTML='<span>💬</span>پیام‌ها'+(n?`<i class='bdg'>${n.toLocaleString('fa-IR')}</i>`:'');b.onclick=()=>go('msg');nav.insertBefore(b,nav.lastElementChild);
 if(tab!='msg')return;
 const main=document.getElementById('main'),F=x=>x.toLocaleString('fa-IR');
 main.innerHTML=`<h2>پیام مشتری‌ها</h2><div class='mut' style='margin-bottom:8px'>قیمت بازار الان: ${F(G.price)}$ · داری: ${F(G.bags)} کیسه</div>`
 +(G.cu.length?G.cu.map(c=>{const q=Math.min(G.bags,c.want),d=(c.o-G.price)*q;return `<div class='card'><div class='row' style='justify-content:flex-start'><span class='av'>🥷</span><b>ناشناس ${F(c.id%1000)}</b></div><div class='bub'>سلام! من ${F(c.want)} کیسه وید می‌خوام. ${MOOD[c.mood].t}</div><div class='row' style='justify-content:center;gap:6px'>${[-5,-1].map(x=>`<button class='g sm' data-a='adj:${c.id}:${x}'>${F(x)}</button>`).join('')}<b style='font-size:24px;min-width:70px;text-align:center'>${F(c.o)}$</b>${[1,5].map(x=>`<button class='g sm' data-a='adj:${c.id}:${x}'>+${F(x)}</button>`).join('')}</div><div class='mut' style='text-align:center;margin:6px 0'>قیمت هر کیسه${q<c.want?' · فقط '+F(q)+' کیسه داری':''}${q?' · <span class='+(d>=0?'up>سود':'dn>ضرر')+' نسبت به بازار: '+F(Math.abs(d))+'$</span>':''}</div><div class='row'><button class='o' style='flex:2' data-a='sell:${c.id}' ${q?'':'disabled'}>بفروش ${F(q)} کیسه</button><button class='g' style='flex:1' data-a='no:${c.id}'>رد کن</button></div></div>`}).join(''):`<div class='card mut' style='text-align:center'>فعلاً پیامی نیست. مشتری‌ها هر چند دقیقه پیام می‌دن 💬</div>`);
 main.onclick=e=>{const a=e.target.closest('[data-a]');if(!a)return;const [t,id,v]=a.dataset.a.split(':'),c=G.cu.find(x=>x.id==id);if(!c)return;
  if(t=='adj')c.o=Math.max(1,Math.min(400,c.o+ +v));
  else{G.cu=G.cu.filter(x=>x!=c);
   if(t=='sell'){const q=Math.min(G.bags,c.want);
    if(c.o>c.max)toast('😤 '+'ناشناس'+' گفت گرونه و رفت');
    else{G.bags-=q;G.m+=q*c.o;const d=(c.o-G.price)*q;toast(d>=0?'✅ +'+F(q*c.o)+'$ · '+F(d)+'$ بالاتر از بازار':'⚠️ +'+F(q*c.o)+'$ · '+F(-d)+'$ زیر بازار (ضرر)')}}
   else toast('رد شد')}
  save();render()};
}
const ACN=['جنگلی','بنفش هیز','طلایی','صورتی','اقیانوسی'];
const ACC=[null,['#7a4fb5','#b98cff','#e8871e','#ffa63d'],['#b07a00','#ffcf4a','#3d8b2f','#7bd35a'],['#d6336c','#ff7aa8','#7a4fb5','#b98cff'],['#1c8fb0','#4fd3f0','#e8871e','#ffa63d']];
const POTS=[['#b5651d','#d08034','سفالی'],['#5b6770','#7d8a94','سنگی'],['#7a4fb5','#9a62d6','بنفش'],['#c9a227','#ffd24a','طلایی'],['#2a2a2a','#555555','مشکی']];
G.th=G.th||{mode:'auto',ac:0,pot:0};
function applyTheme(){
 const r=document.documentElement,t=G.th,st=r.style,dk=t.mode=='dark'||t.mode=='amoled'||(t.mode=='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
 if(t.mode=='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t.mode=='light'?'light':'dark');
 ['--ac','--hot','--bg','--card','--bar','--bd'].forEach(p=>st.removeProperty(p));
 const A=ACC[t.ac];if(A){st.setProperty('--ac',dk?A[1]:A[0]);st.setProperty('--hot',dk?A[3]:A[2])}
 if(t.mode=='amoled'){st.setProperty('--bg','#000');st.setProperty('--card','#0b0f0a');st.setProperty('--bar','#161d13');st.setProperty('--bd','#222c1e')}
}
const _ps=plantSVG;plantSVG=function(k,m){const c=POTS[G.th.pot]||POTS[0];return _ps(k,m).replace('#b5651d',c[0]).replace('#d08034',c[1])};
function themeUI(){
 const nav=document.getElementById('nav'),b=document.createElement('b');
 b.className=tab=='theme'?'on':'';b.innerHTML='<span>🎨</span>تم';b.onclick=()=>go('theme');nav.appendChild(b);
 if(tab!='theme')return;
 const t=G.th,main=document.getElementById('main'),W=' style="flex-wrap:wrap"';
 const ch=(k,on,label,x)=>`<div class='chip ${on?'on':''}' data-k='${k}'>${x||''}${label}</div>`;
 const dot=c=>`<span style='display:inline-block;width:14px;height:14px;border-radius:50%;background:${c};vertical-align:middle;margin-left:6px'></span>`;
 main.innerHTML=`<h2>شخصی‌سازی</h2><div class='card row' style='justify-content:center;gap:24px'>${plantSVG(G.sel,'ready').replace("height='50'","height='110'")}${scSVG(TI[G.sc],70)}</div>`
 +`<h2>حالت نمایش</h2><div class='chips'${W}>${[['auto','خودکار'],['light','روشن'],['dark','تیره'],['amoled','شب سیاه']].map(m=>ch('mode:'+m[0],t.mode==m[0],m[1])).join('')}</div>`
 +`<h2>رنگ بازی</h2><div class='chips'${W}>${ACN.map((n,i)=>ch('ac:'+i,t.ac==i,n,dot(ACC[i]?ACC[i][0]:'#3d8b2f'))).join('')}</div>`
 +`<h2>رنگ گلدون</h2><div class='chips'${W}>${POTS.map((p,i)=>ch('pot:'+i,t.pot==i,p[2],dot(p[0]))).join('')}</div>`;
 main.onclick=e=>{const c=e.target.closest('[data-k]');if(!c)return;const [a,v]=c.dataset.k.split(':');G.th[a]=a=='mode'?v:+v;save();applyTheme();render()};
}
applyTheme();
const _r=render;render=function(){_r();decorate();themeUI();msgUI();packUI()};
render();setInterval(tick,250);
</script>
</body>
